name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        # Optional repo secrets — without them the app runs in offline/fallback
        # mode (stylised terrain, static Flight Director text). NOTE: any key
        # set here is baked into the public bundle — use restricted keys only.
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_POOL: ${{ secrets.VITE_GEMINI_API_KEY_POOL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          pnpm build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            {
              echo '### Build failed — last 80 lines'
              echo '```'
              tail -80 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      # Deploy dist to the gh-pages branch — GitHub auto-enables Pages for it
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
